<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New request')}"></head>
<body>
<header th:replace="~{fragments :: topbar(${user})}"></header>
<main class="page narrow">
    <h1>New event request</h1>
    <p class="muted">
        One form instead of separate emails to the hall reservation office and the dean.
        Requests must be made at least 30 days before the event.
        <a th:href="@{/calendar}">Check the calendar</a> for free slots first.
    </p>
    <div th:replace="~{fragments :: messages}"></div>

    <form th:action="@{/club/requests}" th:object="${form}" method="post" class="stack card" novalidate>
        <label>Event title
            <input type="text" th:field="*{title}" maxlength="150" required>
            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </label>

        <label>Description / proposal
            <textarea th:field="*{description}" rows="5" maxlength="2000" required
                      placeholder="What is the event, who is it for, and what do you need?"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </label>

        <div class="grid-2">
            <label>Event type
                <select th:field="*{eventType}" required>
                    <option value="">Choose…</option>
                    <option th:each="t : ${eventTypes}" th:value="${t}" th:text="${t.label()}">Type</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('eventType')}" th:errors="*{eventType}"></span>
            </label>

            <label>Expected attendance
                <input type="number" th:field="*{expectedAttendance}" min="1">
                <span class="hint">Required for technical events and workshops.</span>
                <span class="field-error" th:if="${#fields.hasErrors('expectedAttendance')}" th:errors="*{expectedAttendance}"></span>
            </label>
        </div>

        <label>Venue
            <select th:field="*{venueId}" required>
                <option value="">Choose…</option>
                <option th:each="v : ${venues}" th:value="${v.id}"
                        th:text="${v.name} + ' (' + ${v.location} + ', seats ' + ${v.capacity} + ')'">Venue</option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('venueId')}" th:errors="*{venueId}"></span>
        </label>

        <div class="grid-3">
            <label>Date
                <input type="date" th:field="*{date}" th:attr="min=${minDate}" required>
                <span class="hint" th:text="'Earliest: ' + ${minDateLabel}">Earliest date</span>
                <span class="field-error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
            </label>
            <label>Start time
                <input type="time" th:field="*{startTime}" required>
                <span class="field-error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></span>
            </label>
            <label>End time
                <input type="time" th:field="*{endTime}" required>
                <span class="field-error" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></span>
            </label>
        </div>

        <div class="actions">
            <button type="submit" class="primary">Submit request</button>
            <a th:href="@{/club/requests}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
