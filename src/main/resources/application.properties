spring.application.name=eventdesk

# All connection details come from environment variables; nothing secret is committed.
# Defaults are for local development only.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eventdesk}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Flyway creates and evolves the schema (src/main/resources/db/migration).
# Hibernate only checks that the entities match it, and never alters tables.
spring.jpa.hibernate.ddl-auto=validate
# Store and read all timestamps in UTC; the UI converts to IST for display.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Load what each page needs explicitly instead of lazy-loading during rendering.
spring.jpa.open-in-view=false

# Hosting platforms pass the port to listen on in PORT.
server.port=${PORT:8080}

# Time zone used to show and enter event times.
app.time-zone=Asia/Kolkata

# Demo mode: lists one-click demo accounts on the sign-in page so reviewers
# can try every role. Set DEMO_LOGINS_ENABLED=false for a real deployment.
app.demo-logins-enabled=${DEMO_LOGINS_ENABLED:true}
# The shared password of the seeded demo accounts (public demo data, not a secret).
app.demo-password=demo1234


# Show the exception's message on error pages (our messages are written for users).
server.error.include-message=always
